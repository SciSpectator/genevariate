[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genevariate"
version = "0.9.0"
description = "Expression-region analysis of public transcriptomic corpora: which sample labels occupy a region of a gene's own distribution, with the clumping of samples into studies carried through every interval"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "GeneVariate Development Team"},
]
keywords = [
    "bioinformatics", "gene-expression", "GEO", "microarray", "RNA-seq",
    "enrichment", "GSEA", "variability", "ARCHS4", "LLM",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
    "GEOparse>=2.0",
    "requests>=2.31",
    "psutil>=5.9",
    # Imported unguarded by normalize_counts and the bimodality gate,
    # so neither is optional in practice.
    "rnanorm>=2",
    "diptest>=0.7",
    "Pillow>=10",
    # tabulate is NOT listed: enrichment.py falls back to a hand-rolled table
    # when it is absent. h5py is NOT listed: nothing in the package imports it
    # (ARCHS4 access goes through archs4py, in the "analysis" extra). The
    # ollama Python client is NOT listed: a local endpoint is reached over HTTP
    # and the server is started through its own binary, not through the client.
]

[project.optional-dependencies]
# Gene-set over-representation and the ARCHS4 source
analysis = [
    "gseapy>=1.1",
    "archs4py>=0.2.18",
]
# Formal bimodality gate: Hartigan dip test + Gaussian-mixture BIC mode counting
bimodality = [
    "diptest>=0.7",
    "scikit-learn>=1.1",
]
# Cross-platform batch integration (ComBat + Harmony)
integration = [
    "inmoose>=0.2",
    "harmonypy>=0.0.9",
]
# LLM-GEO-Label-Extractor pipeline (vendored under genevariate/_vendor/geo_label_extractor)
# Phase 1 extraction + Phase 2 MeSH/Cellosaurus normalization
llm-extract = [
    "sentence-transformers>=2.7",
    "torch>=1.11",
]
# LangChain reasoning agent with a pluggable backend (GENEVARIATE_AGENT_BACKEND:
# groq [default] | ollama | openai-compatible). The app auto-installs the base
# stack + the chosen backend client on first use, so this extra is only for
# pre-provisioning. Model via GENEVARIATE_AGENT_MODEL; local models auto-pulled.
agent = [
    "langchain>=1.0",
    "langchain-groq>=0.2",
    "langchain-ollama>=0.3",
]
all = [
    "genevariate[analysis,bimodality,integration,agent,llm-extract]",
]

[project.scripts]
genevariate = "genevariate.main:main"
genevariate-llm-extract = "genevariate.core.geo_extract_driver:cli"

[project.gui-scripts]
genevariate-gui = "genevariate.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["genevariate*"]

[tool.setuptools.package-data]
# Keyed on the real package: "genevariate.assets" has no __init__.py, is not a
# package, and so was silently ignored - the app icon and the per-source logos
# that app.py loads from assets/icons/ were never installed.
"genevariate" = ["assets/*", "assets/icons/*"]
"genevariate.gui" = ["assets/*"]

